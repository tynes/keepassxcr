[package]
name = "keepassxcr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
digest = "0.10"
aes = "0.8"
twofish = "0.7"
cbc = "0.1"
cipher = "0.4"
chacha20 = "0.9"
salsa20 = "0.10"
# "zeroize" wipes Argon2's working memory after use.
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
flate2 = "1.0"
quick-xml = "0.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
secrecy = "0.8"
# "serde" lets the agent protocol carry key material in wiped buffers.
zeroize = { version = "1.7", features = ["serde"] }
libc = "0.2"
arboard = "3.4"
zxcvbn = "2.2"
time = { version = "0.3", features = ["formatting", "parsing"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
# YubiKey OTP interface: IOKit on macOS (opened shared), pure-Rust hidraw on Linux.
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev", "macos-shared-device"] }

[features]
# Testing only: KEEPASSXCR_SOFTWARE_YUBIKEY=<hex secret>[:fixed][:touch] replaces the
# USB YubiKey with an emulated one. Never enable this for a build you use.
software-yubikey = []

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
