name: Release

# Push a tag like v0.1.0 to publish that version to crates.io and create the
# GitHub release. Needs a CARGO_REGISTRY_TOKEN repository secret with the
# publish-new and publish-update scopes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "keepassxcr") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --locked --features software-yubikey

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Add a CARGO_REGISTRY_TOKEN repository secret (crates.io > Account Settings > API Tokens)"
            exit 1
          fi
          # A re-run after a later step failed finds the version already there.
          if curl -sf -A "keepassxcr-release (github.com/tynes/keepassxcr)" \
              "https://crates.io/api/v1/crates/keepassxcr/$VERSION" > /dev/null; then
            echo "keepassxcr $VERSION is already on crates.io"
          else
            cargo publish --locked
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "keepassxcr $VERSION" --notes-file notes.md --verify-tag
          fi
